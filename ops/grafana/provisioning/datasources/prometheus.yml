# Auto-provisioned Prometheus datasource.
# uid is fixed to `prometheus` so the imported dashboard's ${DS_PROMETHEUS}
# variable resolves without manual datasource selection.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
