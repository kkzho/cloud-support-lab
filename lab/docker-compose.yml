# Local Docker orchestration for the cloud-support-lab drill stack.
#
# NOTE: this sandbox has no docker daemon, so this file is provided as a
# ready-to-run "real" version and is NOT started here. On a machine with
# Docker:  cd lab && docker compose up -d
#
# Topology (mirrors the simulated 3-tier business):
#   loadgen -> nginx (SLB/gateway) -> app (business, /healthz + /api/order/list
#   + /metrics) -> redis (cache) + mysql (db);  prometheus/grafana/alertmanager
#   observe the whole chain; node-exporter/mysqld-exporter/redis-exporter feed
#   infra metrics.
#
# --- China / slow Docker Hub users -----------------------------------------
# If `docker compose pull` times out against registry-1.docker.io, set registry
# mirrors in Docker Desktop -> Settings -> Docker Engine:
#   "registry-mirrors": [
#     "https://docker.m.daocloud.io",
#     "https://hub-mirror.c.163.com",
#     "https://mirror.baidubce.com"
#   ]
# Then click "Apply & Restart" and re-run `docker compose up -d`.
# If a single image still fails, run scripts/pull-images.sh which retags a
# mirror-prefixed pull to the expected image name.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------- gateway / SLB ------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: drill-nginx
    depends_on: [app]
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    logging: *default-logging
    # An access layer that proxies /api/* to app, exposes /healthz, and returns
    # 502/504 when the app backend is unhealthy (health check driven by app).

  # ---------- business app (the simulator itself) --------------------------
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: drill-app
    environment:
      APP_PORT: "8080"
      # Preload a scenario for manual demos, e.g. S2-conn-pool-exhaustion.
      DRILL_SCENARIO: "${DRILL_SCENARIO:-}"
      REDIS_HOST: redis
      DB_HOST: mysql
    depends_on: [redis, mysql]
    ports:
      - "8080:8080"
    logging: *default-logging
    # Runs: python3 sim/app.py --port 8080 (optionally --scenario ${DRILL_SCENARIO})
    # Exposes /healthz, /api/order/list and /metrics (stdlib http.server).

  # ---------- cache --------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: drill-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    logging: *default-logging

  # ---------- database -----------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: drill-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "drill-root"
      MYSQL_DATABASE: "orders"
    command:
      - "--max-connections=100"
      - "--slow-query-log=1"
      - "--long-query-time=0.5"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    logging: *default-logging

  # ---------- observability ------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: drill-prometheus
    depends_on: [app, alertmanager]
    ports:
      - "9090:9090"
    volumes:
      - ../ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../ops/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: drill-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ../ops/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.2.0
    container_name: drill-grafana
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ../ops/grafana/dashboard.json:/var/lib/grafana/dashboards/order-api/dashboard.json:ro
      - ../ops/grafana/provisioning:/etc/grafana/provisioning:ro
    logging: *default-logging

  # nginx metrics exporter for the gateway job (scrapes nginx /stub_status)
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: drill-nginx-exporter
    command: ["-nginx.scrape-uri=http://nginx:80/stub_status"]
    depends_on: [nginx]
    ports:
      - "9113:9113"
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: drill-node-exporter
    pid: host
    ports:
      - "9100:9100"
    logging: *default-logging

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: drill-mysqld-exporter
    environment:
      DATA_SOURCE_NAME: "root:drill-root@(mysql:3306)/"
    depends_on: [mysql]
    ports:
      - "9104:9104"
    logging: *default-logging

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: drill-redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on: [redis]
    ports:
      - "9121:9121"
    logging: *default-logging

  # ---------- load generator ----------------------------------------------
  loadgen:
    image: alpine:3.20
    container_name: drill-loadgen
    depends_on: [nginx]
    command:
      - /bin/sh
      - -c
      - "apk add --no-cache curl >/dev/null 2>&1; while true; do curl -s -o /dev/null -w '%{http_code}' http://nginx/api/order/list; sleep 0.05; done"
    logging: *default-logging
    # Sustains ~20 rps against the gateway so latency/error panels stay live.

volumes:
  mysql-data: {}
