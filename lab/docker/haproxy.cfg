# SLB / access layer for the drill stack.
#
# This is the piece open-source nginx CANNOT do: an ACTIVE health check.
# nginx only has passive checks (it reacts to real request failures), so a
# healthy business path keeps a badly "health-checked" backend marked UP.
# A cloud SLB (阿里云 SLB / 腾讯云 CLB / 华为云 ELB) instead probes /healthz
# on a fixed interval and removes the backend after N consecutive failures.
#
# Topology:  client -> haproxy (SLB, :80) -> nginx (internal ingress) -> app
#
# Behaviour emulated:
#   * /healthz probes every 2s; 2 consecutive non-200 -> backend DOWN
#   * while DOWN, business traffic gets 502 (no healthy upstream)
#   * direct calls to the app on :8080 keep returning 200 (backend is fine)
global
  maxconn 4096

defaults
  mode http
  option httplog
  timeout connect 2s
  timeout client 10s
  timeout server 10s

frontend fe_slb
  bind *:80
  default_backend be_ingress
  # When every backend is DOWN, answer like a cloud SLB: 502 Bad Gateway.
  http-request return status 502 content-type text/plain string "502 Bad Gateway (no healthy upstream) - SLB health check failed" if { nbsrv(be_ingress) lt 1 }

backend be_ingress
  # ACTIVE health check: probe /healthz every 2s, DOWN after 2 fails, UP after 2 OKs.
  option httpchk GET /healthz
  http-check expect status 200
  server ingress nginx:80 check inter 2s fall 2 rise 2
