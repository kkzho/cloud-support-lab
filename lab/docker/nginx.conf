# Internal ingress for the drill stack (sits behind the HAProxy SLB layer).
# Proxies business traffic to the app backend and provides /stub_status for
# nginx-prometheus-exporter. Health is decided by HAProxy (active checks).
worker_processes 1;
events { worker_connections 1024; }

http {
    upstream order_api {
        server app:8080 max_fails=2 fail_timeout=10s;
    }

    # Free-ish access log so `upstream timed out` / 502 / 504 show up during S5.
    log_format drill '$remote_addr "$request" $status '
                     '$upstream_status rt=$request_time urt=$upstream_response_time '
                     '"$upstream_addr"';
    access_log /var/log/nginx/access.log drill;

    server {
        listen 80;
        server_name _;

        location = /healthz {
            proxy_pass http://order_api/healthz;
        }

        location /api/ {
            proxy_connect_timeout 1s;
            proxy_read_timeout 3s;
            proxy_next_upstream error timeout http_502 http_504;
            proxy_pass http://order_api;
        }

        location = /metrics {
            proxy_pass http://order_api/metrics;
        }

        # Exposed to nginx-prometheus-exporter (gateway-layer metrics) so the
        # Prometheus `gateway` job has a live scrape target.
        location = /stub_status {
            stub_status;
            allow all;
        }
    }
}
