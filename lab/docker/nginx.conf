# Gateway / SLB front end for the drill stack.
# Proxies business traffic to the app backend and surfaces 502/504 when the
# backend is unhealthy (mirrors the S5 health-check failure scenario).
worker_processes 1;
events { worker_connections 1024; }

http {
    upstream order_api {
        server app:8080 max_fails=2 fail_timeout=10s;
    }

    # Free-ish access log so `upstream timed out` / 502 / 504 show up during S5.
    log_format drill '$remote_addr "$request" $status '
                     '$upstream_status rt=$request_time urt=$upstream_response_time '
                     '"$upstream_addr"';
    access_log /var/log/nginx/access.log drill;

    server {
        listen 80;
        server_name _;

        location = /healthz {
            proxy_pass http://order_api/healthz;
        }

        location /api/ {
            proxy_connect_timeout 1s;
            proxy_read_timeout 3s;
            # http_500 也计为"后端不可用"，这样 /healthz 返回 500 时，
            # nginx 的被动健康检查(max_fails=2)会把 app 摘掉，网关返回 502，
            # 而直连 app:8080 仍是 200 —— 还原 S5"后端健康但网关 5xx"。
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_pass http://order_api;
        }

        location = /metrics {
            proxy_pass http://order_api/metrics;
        }

        # Exposed to nginx-prometheus-exporter (gateway-layer metrics) so the
        # Prometheus `gateway` job has a live scrape target.
        location = /stub_status {
            stub_status;
            allow all;
        }
    }
}
